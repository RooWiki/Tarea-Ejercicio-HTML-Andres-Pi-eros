<!DOCTYPE html>
<html leng="es">
	<head>
		<meta charset="utf-8">
		<link rel="icon" type="image/x-icon" href="bd47d11069878855f9c4d160f2ea.ico">
		<title>America Insomnio</title>
		<link rel="stylesheet" type="text/css" href="estilo.css"> <!-- Llama a una hoja de estilo de tipo CSS -->
		
	</head>


	<body>
		<form>
			<section class="form-register">
			<b class="Titulo">REGISTRO</b>

			<p>Nombre</p>
			<input class="controls" type="text" size="30" placeholder="Escriba su nombre aquí " name="nombre" required>

			<p>Documento</p>
			<input class="controls" type="text" size="30" placeholder="Escriba su cédula aquí" name="documento" required>

			<p>Fecha de Nacimiento</p>
			<input class="controls" type="date" size="30" placeholder="Escriba su nombre aquí " name="fecha">

			<p>Correo</p>
			<input class="controls" type="email" name="correo" size="30">

			<p>Clave</p>
			<input class="controls" type="password" size="30" name="clave">


			<p>Prenda</p>
			<select class="controls" name="transporte">

			<option>Camisa</option>

			<option>Camiseta</option>

			<option>Buzo</option>

			</select>
			 <br>


			<p>Talla</p>
			<input type="radio" name="hm" value="S" id="S">
			<label for="h">S</label>
			<input type="radio" name="hm" value="M" id="M">
			<label for="m">M</label>
			<input type="radio" name="hm" value="L" id="L">
			<label for="m">L</label>

			<br><br>
			<p>Color</p>
			<input class="color" type="color">
			<br>

			<input  class="submit" type="submit" value="Aceptar">
			</section>
		</form>
	</body>
</html>
